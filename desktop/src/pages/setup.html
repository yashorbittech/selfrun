<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Connect your workspace</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#0b1020; --muted:#5b6478; --primary:#4338ca; --line:#e4e7f0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#eef0ff; --muted:#a3acc9; --primary:#7c75f5; --line:#27305a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:420px; padding:32px; }
  h1 { margin:0 0 6px; font-size:26px; letter-spacing:-.02em; }
  p { margin:0 0 22px; color:var(--muted); }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; }
  input:focus { outline:2px solid var(--primary); outline-offset:1px; }
  button { margin-top:14px; width:100%; border:0; border-radius:12px; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--primary); cursor:pointer; }
  button[disabled] { opacity:.6; cursor:progress; }
  .err { margin-top:12px; color:#dc2626; min-height:1.4em; }
  .hint { margin-top:18px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Connect your workspace</h1>
  <p>Enter your workspace name or address. Your company's name, logo and colours load automatically.</p>
  <form id="f">
    <label for="a">Workspace</label>
    <input id="a" autocomplete="off" autofocus placeholder="acme  or  app.acme.com">
    <button id="b" type="submit">Continue</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <p class="hint">Not sure? Ask your administrator for the app address from Workspace → Settings → Mobile app.</p>
</main>
<script src="setup.js"></script>
</body>
</html>
