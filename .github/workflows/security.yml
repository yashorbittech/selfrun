name: Security checks

# Release gates: a change is not merged or released with a known critical or high finding.
#  - Static analysis (SAST): CodeQL over the TypeScript/JavaScript code.
#  - Dependency scanning (SCA): npm audit of what ships to production, and a review of dependency changes in pull requests.
#  - Secret scanning: no credential committed (scripts/scan-secrets.mjs).
#  - Quality gate: type check and lint.
# Runs on every push to main, on every pull request, and weekly (new vulnerabilities appear in code that has not changed).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-secrets.mjs

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Everything that ships to production: a high or critical vulnerability fails the check.
      - run: npm audit --omit=dev --audit-level=high
      # The desktop and mobile build tools ship installers, so they are audited too.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop
        continue-on-error: true
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mobile
        continue-on-error: true

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  trivy:
    name: Trivy (dependencies and configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reports high and critical findings in lockfiles and configuration. It informs; the blocking dependency gate is `npm audit` above.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  quality:
    name: Type check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=100000
