<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>You're offline</title>
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --fg:#0b1020; --muted:#5b6478; --primary:#4338ca; --line:#e4e7f0; --card:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#eef0ff; --muted:#a3acc9; --primary:#7c75f5; --line:#27305a; --card:#111833; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width:420px; width:100%; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:36px 28px; }
    .icon { width:56px; height:56px; margin:0 auto 20px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--primary) 12%, transparent); color:var(--primary); }
    h1 { margin:0 0 8px; font-size:26px; letter-spacing:-.02em; }
    p { margin:0 0 24px; color:var(--muted); line-height:1.55; font-size:15px; }
    button { appearance:none; border:0; border-radius:12px; padding:12px 22px; font:inherit; font-weight:600; color:#fff; background:var(--primary); cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/><path d="m3 3 18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Your workspace needs an internet connection. Check your connection and try again — nothing you entered has been lost on the server.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
